<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My rin's birthday </title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #050510;
            color: #ffffff;
            font-family: Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        .ui-overlay * {
            pointer-events: auto;
        }

        .control-panel {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 10, 26, 0.85);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 15px;
            padding: 15px 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            min-width: 400px;
        }

        .date-display {
            font-size: 1.2em;
            font-weight: 700;
            color: #00f3ff;
        }

        .time-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .control-btn {
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid rgba(0, 243, 255, 0.4);
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9em;
            transition: all 0.3s ease;
        }

        .control-btn:hover {
            border-color: #00f3ff;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
        }

        .control-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .planet-selector {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(10, 10, 26, 0.85);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 15px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 150px;
        }

        .planet-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .planet-option:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .planet-option.active {
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid #00f3ff;
        }

        .planet-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #050510;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 1s ease;
        }

        .loading-text {
            font-size: 1.8em;
            color: #00f3ff;
            margin-bottom: 20px;
        }

        .loading-bar-container {
            width: 300px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .loading-bar {
            height: 100%;
            background: linear-gradient(90deg, #00f3ff, #ff4d7c);
            width: 0%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div class="ui-overlay">
        <div class="control-panel">
            <div class="date-display" id="currentDate">September 16, 2007</div>
            <div class="time-controls">
                <button class="control-btn" id="prevDecade" disabled>-10y</button>
                <button class="control-btn" id="prevYear" disabled>-1y</button>
                <button class="control-btn" id="reset">Reset</button>
                <button class="control-btn" id="nextYear">+1y</button>
                <button class="control-btn" id="nextDecade">+10y</button>
            </div>
            <div class="time-controls">
                <button class="control-btn" id="playPause">⏸️ Pause</button>
                <button class="control-btn" id="speedDown">Slower</button>
                <span style="color: #00f3ff; margin: 0 10px;" id="speedDisplay">1x</span>
                <button class="control-btn" id="speedUp">Faster</button>
            </div>
        </div>

        <div class="planet-selector">
            <div class="planet-option active" data-planet="sun">
                <div class="planet-color" style="background: #FFD700;"></div>
                <span>Sun</span>
            </div>
            <div class="planet-option" data-planet="mercury">
                <div class="planet-color" style="background: #8C7853;"></div>
                <span>Mercury</span>
            </div>
            <div class="planet-option" data-planet="venus">
                <div class="planet-color" style="background: #FFC649;"></div>
                <span>Venus</span>
            </div>
            <div class="planet-option" data-planet="earth">
                <div class="planet-color" style="background: #6B93D6;"></div>
                <span>Earth</span>
            </div>
            <div class="planet-option" data-planet="mars">
                <div class="planet-color" style="background: #FF6B35;"></div>
                <span>Mars</span>
            </div>
            <div class="planet-option" data-planet="jupiter">
                <div class="planet-color" style="background: #C9A283;"></div>
                <span>Jupiter</span>
            </div>
            <div class="planet-option" data-planet="saturn">
                <div class="planet-color" style="background: #E4D191;"></div>
                <span>Saturn</span>
            </div>
            <div class="planet-option" data-planet="uranus">
                <div class="planet-color" style="background: #4FD0E7;"></div>
                <span>Uranus</span>
            </div>
            <div class="planet-option" data-planet="neptune">
                <div class="planet-color" style="background: #4B70DD;"></div>
                <span>Neptune</span>
            </div>
        </div>
    </div>

    <div class="loading-screen" id="loadingScreen">
        <div class="loading-text">Rin</div>
        <div class="loading-bar-container">
            <div class="loading-bar" id="loadingProgress"></div>
        </div>
    </div>

    <script>
        class CosmosExplorer {
            constructor() {
                this.scene = null;
                this.camera = null;
                this.renderer = null;
                this.controls = null;
                
                this.currentDate = new Date(2007, 8, 16);
                this.baseDate = new Date(2007, 8, 16);
                this.yearOffset = 0;
                this.maxYears = 100;
                this.timeSpeed = 1;
                this.isPlaying = true;
                
                this.sun = null;
                this.planets = {};
                this.planetData = {};
                this.stars = null;
                
                this.selectedPlanet = 'sun';
                
                this.init();
            }

            init() {
                this.setupScene();
                this.setupCamera();
                this.setupRenderer();
                this.setupControls();
                this.setupLighting();
                this.setupSolarSystem();
                this.setupUI();
                this.animate();
            }

            setupScene() {
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x050510);
            }

            setupCamera() {
                this.camera = new THREE.PerspectiveCamera(
                    60, 
                    window.innerWidth / window.innerHeight, 
                    0.1, 
                    10000
                );
                this.camera.position.set(0, 200, 500);
            }

            setupRenderer() {
                this.renderer = new THREE.WebGLRenderer({ 
                    antialias: true,
                    powerPreference: "high-performance"
                });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                this.renderer.shadowMap.enabled = true;
                
                document.getElementById('canvas-container').appendChild(this.renderer.domElement);
            }

            setupControls() {
                this.controls = new THREE.OrbitControls(this.camera, this.renderer.domElement);
                this.controls.enableDamping = true;
                this.controls.dampingFactor = 0.05;
                this.controls.minDistance = 50;
                this.controls.maxDistance = 2000;
            }

            setupLighting() {
                const ambientLight = new THREE.AmbientLight(0x333333);
                this.scene.add(ambientLight);
                
                const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
                directionalLight.position.set(0, 0, 0);
                this.scene.add(directionalLight);
            }

            setupSolarSystem() {
                this.createStarfield();
                
                this.planetData = {
                    sun: {
                        radius: 20,
                        color: 0xFFD700,
                        orbitRadius: 0,
                        orbitPeriod: 0,
                        tilt: 0,
                        rotationPeriod: 25,
                        moons: 0
                    },
                    mercury: {
                        radius: 3.2,
                        color: 0x8C7853,
                        orbitRadius: 60,
                        orbitPeriod: 0.24,
                        tilt: 0.034,
                        rotationPeriod: 58.6,
                        moons: 0
                    },
                    venus: {
                        radius: 6.0,
                        color: 0xFFC649,
                        orbitRadius: 90,
                        orbitPeriod: 0.62,
                        tilt: 2.64,
                        rotationPeriod: 243,
                        moons: 0
                    },
                    earth: {
                        radius: 6.3,
                        color: 0x6B93D6,
                        orbitRadius: 130,
                        orbitPeriod: 1.0,
                        tilt: 23.44,
                        rotationPeriod: 1,
                        moons: 1
                    },
                    mars: {
                        radius: 3.4,
                        color: 0xFF6B35,
                        orbitRadius: 170,
                        orbitPeriod: 1.88,
                        tilt: 25.19,
                        rotationPeriod: 1.03,
                        moons: 2
                    },
                    jupiter: {
                        radius: 15,
                        color: 0xC9A283,
                        orbitRadius: 240,
                        orbitPeriod: 11.86,
                        tilt: 3.13,
                        rotationPeriod: 0.41,
                        moons: 79
                    },
                    saturn: {
                        radius: 12.5,
                        color: 0xE4D191,
                        orbitRadius: 300,
                        orbitPeriod: 29.46,
                        tilt: 26.73,
                        rotationPeriod: 0.45,
                        moons: 82,
                        hasRings: true,
                        ringInnerRadius: 15,
                        ringOuterRadius: 25
                    },
                    uranus: {
                        radius: 8,
                        color: 0x4FD0E7,
                        orbitRadius: 360,
                        orbitPeriod: 84.01,
                        tilt: 97.77,
                        rotationPeriod: 0.72,
                        moons: 27
                    },
                    neptune: {
                        radius: 7.8,
                        color: 0x4B70DD,
                        orbitRadius: 420,
                        orbitPeriod: 164.8,
                        tilt: 28.32,
                        rotationPeriod: 0.67,
                        moons: 14
                    }
                };
                
                this.createSun();
                
                for (const planetName in this.planetData) {
                    if (planetName !== 'sun') {
                        this.createPlanet(planetName);
                    }
                }
                
                this.createOrbits();
            }

            createStarfield() {
                const starGeometry = new THREE.BufferGeometry();
                const starCount = 5000;
                
                const positions = new Float32Array(starCount * 3);
                const colors = new Float32Array(starCount * 3);
                const sizes = new Float32Array(starCount);
                
                for (let i = 0; i < starCount; i++) {
                    const radius = 1000 + Math.random() * 4000;
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos((Math.random() * 2) - 1);
                    
                    const x = radius * Math.sin(phi) * Math.cos(theta);
                    const y = radius * Math.sin(phi) * Math.sin(theta);
                    const z = radius * Math.cos(phi);
                    
                    positions[i * 3] = x;
                    positions[i * 3 + 1] = y;
                    positions[i * 3 + 2] = z;
                    
                    const colorVariation = Math.random();
                    if (colorVariation < 0.7) {
                        colors[i * 3] = 1;
                        colors[i * 3 + 1] = 1;
                        colors[i * 3 + 2] = 1;
                    } else if (colorVariation < 0.85) {
                        colors[i * 3] = 0.8;
                        colors[i * 3 + 1] = 0.9;
                        colors[i * 3 + 2] = 1;
                    } else {
                        colors[i * 3] = 1;
                        colors[i * 3 + 1] = 0.8;
                        colors[i * 3 + 2] = 0.8;
                    }
                    
                    sizes[i] = Math.random() * 2;
                }
                
                starGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                starGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
                starGeometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
                
                const starMaterial = new THREE.PointsMaterial({
                    size: 2,
                    vertexColors: true,
                    transparent: true,
                    opacity: 0.8
                });
                
                this.stars = new THREE.Points(starGeometry, starMaterial);
                this.scene.add(this.stars);
            }

            createSun() {
                const sunGeometry = new THREE.SphereGeometry(this.planetData.sun.radius, 32, 32);
                const sunMaterial = new THREE.MeshBasicMaterial({
                    color: this.planetData.sun.color,
                    emissive: this.planetData.sun.color,
                    emissiveIntensity: 1
                });
                
                this.sun = new THREE.Mesh(sunGeometry, sunMaterial);
                this.sun.name = 'sun';
                this.scene.add(this.sun);
                
                const sunLight = new THREE.PointLight(0xffffff, 2, 1000);
                this.sun.add(sunLight);
                
                this.planets.sun = this.sun;
            }

            createPlanet(planetName) {
                const data = this.planetData[planetName];
                const geometry = new THREE.SphereGeometry(data.radius, 32, 32);
                const material = new THREE.MeshStandardMaterial({
                    color: data.color,
                    roughness: 0.8,
                    metalness: 0.2
                });
                
                const planet = new THREE.Mesh(geometry, material);
                planet.name = planetName;
                planet.castShadow = true;
                planet.receiveShadow = true;
                
                const angle = (Math.PI * 2) * Math.random();
                planet.position.x = Math.cos(angle) * data.orbitRadius;
                planet.position.z = Math.sin(angle) * data.orbitRadius;
                
                planet.rotation.x = data.tilt * (Math.PI / 180);
                
                this.scene.add(planet);
                this.planets[planetName] = planet;
                
                if (planetName === 'saturn' && data.hasRings) {
                    this.createPlanetRings(planet, data);
                }
                
                this.createOrbitalPath(planetName, data.orbitRadius);
            }

            createPlanetRings(planet, data) {
                const ringGeometry = new THREE.RingGeometry(
                    data.ringInnerRadius, 
                    data.ringOuterRadius, 
                    32
                );
                
                const ringMaterial = new THREE.MeshBasicMaterial({
                    color: 0xE4D191,
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0.7
                });
                
                const rings = new THREE.Mesh(ringGeometry, ringMaterial);
                rings.rotation.x = Math.PI / 2;
                planet.add(rings);
            }

            createOrbitalPath(planetName, radius) {
                const curve = new THREE.EllipseCurve(
                    0, 0,
                    radius, radius,
                    0, 2 * Math.PI,
                    false,
                    0
                );
                
                const points = curve.getPoints(50);
                const geometry = new THREE.BufferGeometry().setFromPoints(points);
                const material = new THREE.LineBasicMaterial({
                    color: 0x444466,
                    transparent: true,
                    opacity: 0.3
                });
                
                const orbit = new THREE.Line(geometry, material);
                orbit.rotation.x = Math.PI / 2;
                this.scene.add(orbit);
            }

            createOrbits() {
                // Handled in createPlanet
            }

            updatePlanetPositions() {
                const timeElapsed = this.yearOffset;
                
                for (const planetName in this.planetData) {
                    if (planetName === 'sun') continue;
                    
                    const data = this.planetData[planetName];
                    const planet = this.planets[planetName];
                    
                    if (planet) {
                        const angle = (timeElapsed / data.orbitPeriod) * (2 * Math.PI);
                        planet.position.x = Math.cos(angle) * data.orbitRadius;
                        planet.position.z = Math.sin(angle) * data.orbitRadius;
                        
                        if (this.isPlaying) {
                            const rotationSpeed = (2 * Math.PI) / (data.rotationPeriod * 24);
                            planet.rotation.y += rotationSpeed * this.timeSpeed;
                        }
                    }
                }
            }

            setupUI() {
                document.getElementById('prevYear').addEventListener('click', () => this.changeYear(-1));
                document.getElementById('nextYear').addEventListener('click', () => this.changeYear(1));
                document.getElementById('prevDecade').addEventListener('click', () => this.changeYear(-10));
                document.getElementById('nextDecade').addEventListener('click', () => this.changeYear(10));
                document.getElementById('reset').addEventListener('click', () => this.resetTime());
                document.getElementById('playPause').addEventListener('click', () => this.togglePlayPause());
                document.getElementById('speedUp').addEventListener('click', () => this.changeSpeed(2));
                document.getElementById('speedDown').addEventListener('click', () => this.changeSpeed(0.5));
                
                document.querySelectorAll('.planet-option').forEach(option => {
                    option.addEventListener('click', (e) => {
                        const planet = e.currentTarget.dataset.planet;
                        this.selectPlanet(planet);
                    });
                });
                
                document.addEventListener('keydown', (e) => this.handleKeyDown(e));
                window.addEventListener('resize', () => this.onWindowResize());
                
                this.hideLoadingScreen();
                this.updateButtonStates();
            }

            changeYear(years) {
                const newYearOffset = this.yearOffset + years;
                
                if (newYearOffset >= 0 && newYearOffset <= this.maxYears) {
                    this.yearOffset = newYearOffset;
                    this.updateTimeDisplay();
                    this.updatePlanetPositions();
                    this.updateButtonStates();
                }
            }

            changeSpeed(factor) {
                this.timeSpeed *= factor;
                this.timeSpeed = Math.max(0.125, Math.min(64, this.timeSpeed));
                document.getElementById('speedDisplay').textContent = `${this.timeSpeed}x`;
            }

            togglePlayPause() {
                this.isPlaying = !this.isPlaying;
                document.getElementById('playPause').textContent = this.isPlaying ? '⏸️ Pause' : '▶️ Play';
            }

            resetTime() {
                this.yearOffset = 0;
                this.timeSpeed = 1;
                this.isPlaying = true;
                document.getElementById('playPause').textContent = '⏸️ Pause';
                document.getElementById('speedDisplay').textContent = '1x';
                this.updateTimeDisplay();
                this.updatePlanetPositions();
                this.updateButtonStates();
            }

            updateButtonStates() {
                const prevYearBtn = document.getElementById('prevYear');
                const prevDecadeBtn = document.getElementById('prevDecade');
                const nextYearBtn = document.getElementById('nextYear');
                const nextDecadeBtn = document.getElementById('nextDecade');
                
                prevYearBtn.disabled = this.yearOffset <= 0;
                prevDecadeBtn.disabled = this.yearOffset <= 0;
                nextYearBtn.disabled = this.yearOffset >= this.maxYears;
                nextDecadeBtn.disabled = this.yearOffset >= this.maxYears;
            }

            selectPlanet(planetName) {
                this.selectedPlanet = planetName;
                
                document.querySelectorAll('.planet-option').forEach(option => {
                    option.classList.remove('active');
                });
                document.querySelector(`.planet-option[data-planet="${planetName}"]`).classList.add('active');
                
                this.focusOnPlanet(planetName);
            }

            focusOnPlanet(planetName) {
                const planet = this.planets[planetName];
                if (!planet) return;
                
                const data = this.planetData[planetName];
                const focusDistance = data.radius * 10;
                
                const targetPosition = planet.position.clone();
                targetPosition.y += focusDistance * 0.3;
                targetPosition.z += focusDistance;
                
                this.animateCameraTo(targetPosition, planet.position);
            }

            animateCameraTo(position, lookAt) {
                const startPosition = this.camera.position.clone();
                const startTime = Date.now();
                const duration = 1000;
                
                const animate = () => {
                    const elapsed = Date.now() - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    
                    const ease = progress < 0.5 ? 
                        2 * progress * progress : 
                        -1 + (4 - 2 * progress) * progress;
                    
                    this.camera.position.lerpVectors(startPosition, position, ease);
                    this.controls.target.lerpVectors(this.controls.target, lookAt, ease);
                    
                    if (progress < 1) {
                        requestAnimationFrame(animate);
                    }
                };
                
                animate();
            }

            updateTimeDisplay() {
                this.currentDate = new Date(this.baseDate);
                this.currentDate.setFullYear(this.baseDate.getFullYear() + this.yearOffset);
                
                const dateStr = this.currentDate.toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });
                
                document.getElementById('currentDate').textContent = dateStr;
            }

            handleKeyDown(event) {
                switch(event.key.toLowerCase()) {
                    case ' ':
                        event.preventDefault();
                        this.togglePlayPause();
                        break;
                    case 'r':
                        this.resetTime();
                        break;
                    case 'f':
                        this.focusOnPlanet(this.selectedPlanet);
                        break;
                }
            }

            onWindowResize() {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            }

            hideLoadingScreen() {
                const loadingScreen = document.getElementById('loadingScreen');
                loadingScreen.style.opacity = '0';
                
                setTimeout(() => {
                    loadingScreen.style.display = 'none';
                }, 1000);
            }

            animate() {
                requestAnimationFrame(() => this.animate());
                
                if (this.isPlaying) {
                    this.updatePlanetPositions();
                }
                
                this.controls.update();
                this.renderer.render(this.scene, this.camera);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const loadingProgress = document.getElementById('loadingProgress');
            
            let progress = 0;
            const interval = setInterval(() => {
                progress += Math.random() * 20;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    window.cosmosExplorer = new CosmosExplorer();
                }
                
                loadingProgress.style.width = `${progress}%`;
            }, 200);
        });
    </script>
</body>

</html>
